# =========================
# Scanner Configuration
# =========================

# Basic scan settings
timeout: 30         # Seconds to wait per request
verify_ssl: false   # Set to true for sites with valid certificates
user_agent: "WebSecurityScanner/1.0"
target_url: ""      # Set at runtime via --url
active_tests: true  # Enable active injection tests for XSS, SQLi, etc.

# Module list (simple and explicit)
modules:
  - recon
  - exploitation

# Crawl settings
crawl_depth: 2

# Result handling
result_deduplication: true

# Optional authentication settings for authenticated scans
auth_enabled: false
auth_url: ""
auth_user: ""
auth_pass: ""
auth_username_field: "username"
auth_password_field: "password"

